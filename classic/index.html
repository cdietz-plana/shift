<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift Coverage Agent · Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;transition:background .8s}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
#app{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center}
.mono{font-family:'JetBrains Mono',monospace}
svg{display:block}

/* ---------- shared top bar ---------- */
.topbar{position:absolute;left:0;right:0;top:0;height:72px;display:flex;align-items:center;padding:0 36px;gap:18px;z-index:50}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.brand b{font-size:17px;letter-spacing:.2px}
.brand small{display:block;font-size:11.5px;opacity:.65;margin-top:2px}
.spacer{flex:1}
.themeSwitch{display:flex;padding:4px;border-radius:999px;gap:2px;position:relative}
.themeSwitch button{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;position:relative;z-index:1;transition:color .4s}
.themeSwitch .knob{position:absolute;top:4px;bottom:4px;border-radius:999px;transition:all .5s cubic-bezier(.6,0,.2,1)}
.ghostBtn{font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.who .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
.who small{display:block;font-size:11px;opacity:.6}

/* ---------- stage & panels ---------- */
#stage{position:absolute;inset:0}
.panel{position:absolute;will-change:transform}
.panel .inner{position:absolute;inset:0;overflow:hidden}
.panel .cover{position:absolute;inset:0;display:none;z-index:20;cursor:pointer}
.panel.off .cover{display:block}
.panel.off .inner{pointer-events:none}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:26px 30px 0}
.ph h2{font-size:26px;line-height:1.1}
.ph p{font-size:13px;opacity:.65;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;transition:all .25s}

/* ---------- chat (shared skeleton) ---------- */
.chatWrap{position:absolute;left:30px;top:96px;bottom:28px;width:650px;display:flex;flex-direction:column;border-radius:20px;overflow:hidden}
.chatLog{flex:1;overflow-y:auto;padding:20px 22px 10px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.chatLog::-webkit-scrollbar{width:6px}.chatLog::-webkit-scrollbar-thumb{border-radius:9px}
.msg{max-width:92%;font-size:14px;line-height:1.5}
.msg.me{align-self:flex-end;padding:10px 14px;border-radius:16px 16px 4px 16px}
.msg.ai{align-self:flex-start;display:flex;gap:10px}
.msg.ai .bubble{padding:12px 15px;border-radius:4px 16px 16px 16px}
.msg.ai .who2{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;opacity:.7;margin-bottom:4px}
.aiAv{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 2px;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.starters button,.actBtn{font-size:13px;font-weight:600;padding:9px 14px;border-radius:12px;transition:transform .15s,box-shadow .2s}
.starters button:hover,.actBtn:hover{transform:translateY(-1px)}
.actBtn.primary{padding:10px 18px}
.actRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.composer{display:flex;gap:10px;padding:12px 14px;align-items:center}
.composer input{flex:1;border:0;outline:0;padding:12px 14px;border-radius:12px;font-size:14px}
.composer button{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.reqCard{margin-top:10px;border-radius:14px;padding:14px 16px}
.reqCard .row{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:10px}
.reqCard .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;opacity:.6}
.reqCard .v{font-size:13.5px;font-weight:600;margin-top:2px}
.toggles{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.tog{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;transition:all .2s}
.tog .sw{flex:0 0 36px;height:20px;border-radius:999px;position:relative;transition:background .25s}
.tog .sw::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .25s}
.tog.on .sw::after{left:19px}
.tog b{font-size:13px;display:block}.tog small{font-size:11.5px;opacity:.65}
.elig{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;perspective:800px}
.ecard{height:74px;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1.2)}
.ecard.rev{transform:rotateY(180deg)}
.ecard>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;padding:8px 9px;font-size:11.5px;overflow:hidden}
.ecard .back{transform:rotateY(180deg)}
.ecard .nm{font-weight:700;font-size:12.5px}
.ecard .rs{opacity:.75;margin-top:3px;line-height:1.3}
.ecard .tick{position:absolute;right:7px;top:7px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800}
.offers{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.offer{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:13px}
.offer .nm{flex:1;font-weight:600}
.offer .sub{font-size:11.5px;opacity:.6;font-weight:500}
.offer input{width:16px;height:16px;accent-color:var(--acc)}
.sending{position:relative;overflow:hidden}
.sending::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:shim 1.1s infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.warn{font-size:12px;margin-top:8px;font-weight:600}

/* context rail */
.rail{position:absolute;right:30px;top:96px;bottom:28px;width:calc(100% - 650px - 90px);display:flex;flex-direction:column;gap:14px}
.rcard{border-radius:18px;padding:18px 20px}
.rcard h4{font-size:11px;letter-spacing:.8px;text-transform:uppercase;opacity:.65;margin-bottom:10px}
.stepper{display:flex;align-items:center;gap:0;margin-top:4px}
.stepper .st{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;position:relative;font-size:10.5px;font-weight:600;text-align:center}
.stepper .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;position:relative;z-index:1;transition:all .4s}
.stepper .st:not(:last-child)::after{content:'';position:absolute;top:13px;left:calc(50% + 13px);right:calc(-50% + 13px);height:2px;transition:background .4s}
.seats{display:flex;gap:14px;margin-top:6px}
.seat{flex:1;height:84px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;transition:all .5s}
.statusBig{font-size:20px;font-weight:800;margin-top:4px}

/* toast */
.toast{position:absolute;left:50%;top:84px;transform:translateX(-50%) translateY(-20px);opacity:0;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:80;transition:all .4s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* =====================================================================
   CASINO
   ===================================================================== */
body.casino{background:radial-gradient(ellipse at 50% 30%,#1a2620 0%,#0b100d 55%,#050706 100%);color:#efe6cf}
.casino .topbar{background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
.casino .brand .mark{background:conic-gradient(#d4af37 0 15deg,#7a1d22 15deg 45deg,#d4af37 45deg 60deg,#7a1d22 60deg 90deg,#d4af37 90deg 105deg,#7a1d22 105deg 135deg,#d4af37 135deg 150deg,#7a1d22 150deg 180deg,#d4af37 180deg 195deg,#7a1d22 195deg 225deg,#d4af37 225deg 240deg,#7a1d22 240deg 270deg,#d4af37 270deg 285deg,#7a1d22 285deg 315deg,#d4af37 315deg 330deg,#7a1d22 330deg);box-shadow:0 0 0 2px #2a1a08,0 4px 14px rgba(212,175,55,.35)}
.casino .brand .mark i{width:26px;height:26px;border-radius:50%;background:radial-gradient(#9b2730,#5e1218);display:grid;place-items:center;font-style:normal;font-family:Cinzel;font-weight:900;font-size:13px;color:#f3d77a;border:1px dashed rgba(243,215,122,.6)}
.casino .brand b{font-family:Cinzel;font-weight:700;color:#f0d27a;letter-spacing:1px}
.casino .themeSwitch{background:rgba(0,0,0,.45);border:1px solid rgba(212,175,55,.35)}
.casino .themeSwitch .knob{background:linear-gradient(180deg,#f3d77a,#b88a1e)}
.casino .themeSwitch button.on{color:#1b1206}
.casino .ghostBtn{border:1px solid rgba(212,175,55,.35);color:#e7cf87}
.casino .who .av{background:linear-gradient(#f3d77a,#b88a1e);color:#1b1206}

.casino #stage{perspective:1500px;perspective-origin:50% 18%}
.felt{position:absolute;left:-600px;right:-600px;top:600px;height:1100px;transform-origin:50% 0;transform:rotateX(66deg);
  background:radial-gradient(ellipse 60% 55% at 50% 0%,#1f7a4c 0%,#155c38 40%,#0c3b23 70%,#06200f 100%);
  border-top:10px solid #3a2410;box-shadow:inset 0 30px 60px rgba(0,0,0,.45)}
.felt::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:5px 5px}
.felt .rim{position:absolute;left:0;right:0;top:-10px;height:10px;background:linear-gradient(#d4af37,#7a5a12)}
.felt .print{position:absolute;left:50%;top:380px;transform:translateX(-50%);font-family:Cinzel;font-weight:700;font-size:58px;letter-spacing:10px;color:rgba(240,210,122,.32);white-space:nowrap;text-align:center}
.felt .print small{display:block;font-size:34px;letter-spacing:8px;margin-top:20px;color:rgba(240,210,122,.22)}
.felt .arc{position:absolute;left:50%;top:-520px;width:2400px;height:1400px;transform:translateX(-50%);border-radius:50%;border:4px solid rgba(240,210,122,.28)}
.casino .panel{width:1120px;height:590px;left:240px;top:74px;transition:transform 1s cubic-bezier(.5,0,.25,1.18),filter 1s, opacity 1s}
.casino .panel.rising{transition:transform .95s cubic-bezier(.2,.85,.25,1.06),filter .8s}
.casino .panel .inner{border-radius:26px;background:linear-gradient(170deg,#121d17 0%,#0b130f 60%,#0a0f0c 100%);border:1px solid rgba(212,175,55,.45);
  box-shadow:0 0 0 6px rgba(10,14,12,.6),0 0 0 7px rgba(212,175,55,.18),0 50px 90px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06)}
.casino .panel.on .inner{animation:bob 7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.casino .panel .cover{border-radius:26px;background:radial-gradient(ellipse at center,rgba(8,30,18,.35),rgba(4,16,9,.75));display:none;place-items:center}
.casino .panel.off .cover{display:grid}
.casino .panel .cover span{font-family:Cinzel;font-weight:900;font-size:150px;color:#f3d77a;letter-spacing:6px;text-shadow:0 6px 0 #6b4c0b,0 0 60px rgba(243,215,122,.4);text-align:center;line-height:1}
.casino .panel .cover em{display:block;font-style:normal;font-size:64px;margin-bottom:24px}
.casino .spot{position:absolute;width:1120px;height:590px;left:240px;top:74px;border-radius:40px;border:14px dashed rgba(240,210,122,.35);transition:opacity .6s;pointer-events:none}
.casino .spot b{position:absolute;left:0;right:0;bottom:-190px;text-align:center;font-family:Cinzel;font-size:90px;color:rgba(240,210,122,.35);letter-spacing:6px}
.casino .ph h2{font-family:Cinzel;font-weight:700;font-size:28px;background:linear-gradient(180deg,#fbe7a1,#c99a2e);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.casino .ph p{color:#cbbf9f}
.casino .pill.gold{background:rgba(212,175,55,.14);color:#f0d27a;border:1px solid rgba(212,175,55,.35)}
.casino .pill.red{background:rgba(220,60,60,.16);color:#ff8d8d;border:1px solid rgba(220,60,60,.4)}
.casino .pill.green{background:rgba(60,200,120,.14);color:#7fe3a8;border:1px solid rgba(60,200,120,.35)}
.casino .pill.dim{background:rgba(255,255,255,.06);color:#bfb39a;border:1px solid rgba(255,255,255,.12)}
.casino .seg button{background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.22);color:#d8c99f}
.casino .seg button.on{background:linear-gradient(180deg,#f3d77a,#b88a1e);color:#1b1206;border-color:transparent;box-shadow:0 4px 14px rgba(212,175,55,.3)}

/* chip tray nav */
.tray{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:22px;z-index:40;padding:10px 26px 12px;border-radius:999px;background:linear-gradient(180deg,rgba(40,24,8,.92),rgba(18,10,3,.92));border:1px solid rgba(212,175,55,.45);box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
.chipBtn{display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.chip{--c:#c62f3a;width:46px;height:46px;border-radius:50%;position:relative;display:grid;place-items:center;
  background:repeating-conic-gradient(var(--c) 0 22.5deg,#f6efe0 22.5deg 30deg,var(--c) 30deg 45deg);box-shadow:0 3px 0 rgba(0,0,0,.45),0 6px 12px rgba(0,0,0,.5)}
.chip::before{content:'';position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--c) 75%,#fff),var(--c));border:1.5px dashed rgba(255,255,255,.55)}
.chip svg{position:relative;z-index:1;width:18px;height:18px;color:#fff}
.chipBtn span{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#cdb879}
.chipBtn.on{transform:translateY(-14px)}
.chipBtn.on .chip{box-shadow:0 0 0 3px #f3d77a,0 0 26px rgba(243,215,122,.7),0 10px 18px rgba(0,0,0,.6)}
.chipBtn.on span{color:#fbe7a1}
.chipBtn:hover:not(.on){transform:translateY(-5px)}

/* casino chat skin */
.casino .chatWrap{background:rgba(0,0,0,.28);border:1px solid rgba(212,175,55,.2)}
.casino .chatLog::-webkit-scrollbar-thumb{background:rgba(212,175,55,.3)}
.casino .msg.me{background:linear-gradient(180deg,#f3d77a,#c49a2a);color:#1b1206;font-weight:500}
.casino .msg.ai .bubble{background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.2)}
.casino .msg.ai{animation:deal .55s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes deal{from{opacity:0;transform:translate(60px,-30px) rotate(6deg)}to{opacity:1;transform:none}}
.casino .msg.me{animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.casino .aiAv{background:linear-gradient(#f6efe0,#d9cdb2);color:#7a1d22;font-family:Cinzel;box-shadow:0 0 0 2px #d4af37}
.casino .typing span{background:#d4af37}
.casino .starters button,.casino .actBtn{background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.35);color:#f0d27a}
.casino .actBtn.primary{background:linear-gradient(180deg,#f3d77a,#b88a1e);color:#1b1206;border:0;box-shadow:0 6px 18px rgba(212,175,55,.3)}
.casino .composer{border-top:1px solid rgba(212,175,55,.18);background:rgba(0,0,0,.25)}
.casino .composer input{background:rgba(255,255,255,.05);color:#efe6cf;border:1px solid rgba(212,175,55,.2)}
.casino .composer button{background:linear-gradient(180deg,#f3d77a,#b88a1e);color:#1b1206}
.casino .reqCard{background:linear-gradient(160deg,#1d5d3a,#0f3a23);border:1px solid rgba(212,175,55,.45);box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.casino .tog{background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.18)}
.casino .tog .sw{background:rgba(255,255,255,.15)}
.casino .tog.on{border-color:rgba(212,175,55,.6);background:rgba(212,175,55,.08)}
.casino .tog.on .sw{background:#c99a2e}
.casino .ecard .front{background:repeating-linear-gradient(45deg,#7a1d22 0 6px,#5e1218 6px 12px);border:2px solid #f6efe0;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.casino .ecard .front::after{content:'♦';position:absolute;inset:0;display:grid;place-items:center;color:#f3d77a;font-size:24px}
.casino .ecard .back{background:#f6efe0;color:#1b1206}
.casino .ecard .back.no{background:#3a3330;color:#c9bfae}
.casino .ecard .tick.y{background:#1f8a52;color:#fff}.casino .ecard .tick.n{background:#7a1d22;color:#fff}
.casino .offer{background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.15)}
.casino .warn{color:#ff8d8d}
.casino .rcard{background:rgba(0,0,0,.28);border:1px solid rgba(212,175,55,.2)}
.casino .rcard h4{color:#d4af37}
.casino .stepper .dot{background:#1d241f;border:2px solid #4a4433;color:#8d846c}
.casino .stepper .st.done .dot{background:radial-gradient(#d24350,#8a1d26);border-color:#f3d77a;color:#fff}
.casino .stepper .st.cur .dot{background:linear-gradient(#f3d77a,#b88a1e);border-color:#fff3c4;color:#1b1206;box-shadow:0 0 18px rgba(243,215,122,.7)}
.casino .stepper .st:not(:last-child)::after{background:#3a3528}
.casino .stepper .st.done:not(:last-child)::after{background:#d4af37}
.casino .stepper .st{color:#a99d80}
.casino .seat{background:radial-gradient(ellipse at center,#1a6a42,#0d3d25);border:2px dashed rgba(240,210,122,.45);color:#cdb879}
.casino .seat.fill{border-style:solid;border-color:#f3d77a;box-shadow:0 0 22px rgba(243,215,122,.35)}
.casino .toast{background:linear-gradient(180deg,#f3d77a,#b88a1e);color:#1b1206;box-shadow:0 10px 30px rgba(0,0,0,.5)}

/* casino floor */
.floorSvg .tbl{cursor:pointer;transition:filter .2s}
.floorSvg .tbl:hover{filter:brightness(1.25)}
.floorSvg .open circle.pulse{animation:pulseR 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulseR{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.floorSvg .newd{animation:glowIn 1.6s ease both}
@keyframes glowIn{0%{opacity:0;transform:translateY(-30px)}60%{opacity:1}100%{opacity:1;transform:none}}
.detailCard{position:absolute;right:30px;top:104px;width:330px;bottom:30px;border-radius:20px;padding:20px}
.casino .detailCard{background:rgba(0,0,0,.3);border:1px solid rgba(212,175,55,.22)}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.dl div{font-size:11px;text-transform:uppercase;letter-spacing:.6px;opacity:.6}
.dl b{display:block;font-size:14px;text-transform:none;letter-spacing:0;opacity:1;margin-top:3px;font-weight:600}

/* wheel + chip stacks */
.wheelBall{transition:transform 1.2s cubic-bezier(.3,1.4,.5,1)}
.gapArc{animation:gapPulse 1.3s ease-in-out infinite}
@keyframes gapPulse{0%,100%{opacity:1}50%{opacity:.35}}
.stacks{position:absolute;left:500px;right:30px;top:150px;bottom:30px;border-radius:20px;padding:18px 18px 12px}
.casino .stacks{background:radial-gradient(ellipse at 50% 100%,#1b6a43,#0c3a23);border:1px solid rgba(212,175,55,.35);box-shadow:inset 0 0 50px rgba(0,0,0,.45)}
.stackCols{position:absolute;left:18px;right:18px;bottom:44px;top:56px;display:flex;align-items:flex-end;justify-content:space-between}
.scol{display:flex;flex-direction:column-reverse;align-items:center;width:44px;position:relative}
.cchip{width:40px;height:13px;border-radius:50%;margin-top:-7px;position:relative;
  background:var(--c);border:1.5px solid rgba(0,0,0,.35);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35);
  background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.75) 6px 9px);animation:chipDrop .5s cubic-bezier(.3,1.5,.5,1) both}
.cchip.ghost{background:transparent;border:1.5px dashed #ff7a7a;box-shadow:none;animation:chipDrop .5s both,gapPulse 1.3s infinite}
@keyframes chipDrop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
.scol label{position:absolute;bottom:-26px;font-size:10.5px;color:#cdb879;white-space:nowrap}
.scol .tot{font-size:10.5px;font-weight:700;color:#f0d27a;margin-bottom:8px}
.dayChips{display:flex;gap:10px}
.dchip{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#cdb879;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.dchip .chip{width:44px;height:44px}
.dchip .chip b{position:relative;z-index:1;font-size:11px;color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.dchip.on{transform:translateY(-6px)}
.dchip.on .chip{box-shadow:0 0 0 3px #f3d77a,0 0 18px rgba(243,215,122,.6)}

/* playing cards */
.fan{position:absolute;left:0;right:0;bottom:120px;height:300px}
.pcard{position:absolute;left:50%;bottom:0;width:160px;height:228px;margin-left:-80px;transform-origin:50% 200%;transition:transform .5s cubic-bezier(.3,1.3,.5,1),opacity .4s,filter .4s;perspective:900px;cursor:pointer}
.pcard .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.2,.5,1)}
.pcard.flipped .flip{transform:rotateY(180deg)}
.pcard .face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;box-shadow:0 10px 24px rgba(0,0,0,.55);overflow:hidden}
.pcard .front{background:linear-gradient(170deg,#fffdf6,#f1e9d6);color:#1b1206;padding:10px}
.pcard .front.red{color:#b0202c}
.pcard .corner{position:absolute;font-family:Cinzel;font-weight:900;font-size:17px;line-height:.95;text-align:center}
.pcard .corner small{display:block;font-size:16px}
.pcard .corner.tl{left:9px;top:8px}.pcard .corner.br{right:9px;bottom:8px;transform:rotate(180deg)}
.pcard .mid{position:absolute;left:0;right:0;top:44px;text-align:center}
.pcard .mid .big{font-size:46px;line-height:1}
.pcard .mid b{display:block;font-size:13px;margin-top:4px;color:#1b1206}
.pcard .mid small{display:block;font-size:10.5px;color:#6b5a3a;margin-top:2px}
.pcard .hrs{position:absolute;left:14px;right:14px;bottom:30px;font-size:9.5px;color:#6b5a3a}
.pcard .hrs i{display:block;height:5px;border-radius:5px;background:#e3d7b8;margin-top:3px;overflow:hidden}
.pcard .hrs i u{display:block;height:100%;background:linear-gradient(90deg,#1f8a52,#d4af37);text-decoration:none}
.pcard .hrs i u.ot{background:linear-gradient(90deg,#d4af37,#c62f3a)}
.pcard .back{transform:rotateY(180deg);background:linear-gradient(160deg,#1d5d3a,#0c3a23);border:4px solid #f6efe0;color:#efe6cf;padding:12px;font-size:11px}
.pcard .back b{font-family:Cinzel;color:#f3d77a;font-size:13px}
.pcard .wk{display:flex;gap:3px;margin-top:8px}
.pcard .wk span{flex:1;text-align:center;font-size:9px;font-weight:700}
.pcard .wk span i{display:block;height:26px;border-radius:4px;margin-top:2px}
.pcard .stamp{position:absolute;right:-28px;top:16px;transform:rotate(35deg);background:#c62f3a;color:#fff;font-size:9.5px;font-weight:800;letter-spacing:1px;padding:3px 30px}
.pcard.dim{opacity:.18;filter:grayscale(1)}

/* slot machine */
.slot{position:absolute;left:30px;top:108px;width:600px;height:276px;border-radius:30px;padding:22px;
  background:linear-gradient(180deg,#7a1d22,#4a0d12);border:3px solid #d4af37;box-shadow:0 0 0 6px #2a1a08,0 20px 50px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.5)}
.slot .lights{position:absolute;left:14px;right:14px;top:8px;display:flex;justify-content:space-between}
.slot .lights i{width:9px;height:9px;border-radius:50%;background:#f3d77a;box-shadow:0 0 8px #f3d77a;animation:bulb 1s infinite}
.slot .lights i:nth-child(2n){animation-delay:.5s}
@keyframes bulb{0%,100%{opacity:1}50%{opacity:.25}}
.reels{display:flex;gap:14px;margin-top:22px}
.reel{flex:1;height:150px;border-radius:14px;background:linear-gradient(180deg,#d9d0bc,#fffdf6 30%,#fffdf6 70%,#d9d0bc);overflow:hidden;position:relative;box-shadow:inset 0 8px 16px rgba(0,0,0,.35),inset 0 -8px 16px rgba(0,0,0,.35)}
.reel .strip{position:absolute;left:0;right:0;top:0;transition:transform 2.2s cubic-bezier(.15,.8,.25,1.04)}
.reel .strip div{height:150px;display:grid;place-items:center;font-family:Cinzel;font-weight:900;font-size:58px;color:#7a1d22}
.reelLbl{display:flex;gap:14px;margin-top:12px}
.reelLbl div{flex:1;text-align:center;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fbe7a1}
.lever{position:absolute;right:-46px;top:60px;width:20px;height:150px;border-radius:10px;background:linear-gradient(90deg,#999,#eee,#999);transform-origin:50% 100%;transition:transform .3s;cursor:pointer}
.lever::before{content:'';position:absolute;left:-12px;top:-28px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8d8d,#c62f3a 60%,#6b0f16)}
.lever.pull{transform:scaleY(-.6)}
.board{position:absolute;right:30px;top:108px;width:420px;bottom:26px;border-radius:20px;padding:20px}
.casino .board{background:rgba(0,0,0,.3);border:1px solid rgba(212,175,55,.22)}
.lead{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(212,175,55,.12);font-size:13px}
.lead .rank{font-family:Cinzel;font-weight:900;width:22px;color:#f0d27a}
.lead .bar{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.lead .bar u{display:block;height:100%;background:linear-gradient(90deg,#b88a1e,#f3d77a);text-decoration:none;transition:width 1.2s}
.weekChips{position:absolute;left:30px;width:600px;bottom:26px;height:150px;border-radius:20px;padding:14px 18px 30px;display:flex;align-items:flex-end;justify-content:space-between}
.casino .weekChips{background:radial-gradient(ellipse at 50% 100%,#1b6a43,#0c3a23);border:1px solid rgba(212,175,55,.35)}

/* chip rain */
.rain{position:absolute;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.rain .chip{position:absolute;top:-60px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(1050px) rotate(720deg)}}
.marquee{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.4);opacity:0;font-family:Cinzel;font-weight:900;font-size:110px;color:#f3d77a;letter-spacing:8px;text-shadow:0 6px 0 #6b4c0b,0 0 50px rgba(243,215,122,.8);z-index:91;pointer-events:none;white-space:nowrap}
.marquee.go{animation:marq 2.4s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes marq{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1.05)}}

function railGlance(){

  return `<svg viewBox="0 0 ${W} ${H+18}" width="100%">${bars}${[0,6,12,18].map(h=>`<text x="${h*W/24}" y="${H+14}" font-size="10" fill="currentColor" opacity=".55">${h===0?'12a':h===12?'12p':h<12?h+'a':(h-12)+'p'}</text>`).join('')}</svg>

  if(S.flowBusy)return;
  if(S.req.status==='FILLED'){aiSay(`That one’s already filled. Hit <b>Reset demo</b> to run it again.`);return}
  S.flowBusy=true;const c=cfg(),g=c.gap;
  S.req.status='DRAFT';renderRail();
  const m=await aiSay(`I drafted a coverage requirement from what I see. Check it, then tell me what coverage I can use.
   <div class="reqCard"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:15px">${g.role}</b><span class="pill dim">Draft</span></div>
     <div class="row"><div><div class="k">Where</div><div class="v">${g.loc}</div></div><div><div class="k">When</div><div class="v">${g.win.replace('Tonight · ','Tonight, ')}</div></div>
     <div><div class="k">Headcount</div><div class="v">${g.need} needed</div></div><div><div class="k">Must have</div><div class="v">${g.quals.join(' · ')}</div></div></div></div>
   <div class="toggles">${c.toggles.map(t=>`<button class="tog ${S.opts[t.k]?'on':''}" data-k="${t.k}"><span class="sw"></span><span><b>${t.t}</b><small>${t.s}</small></span></button>`).join('')}</div>
   <div class="actRow"><button class="actBtn primary" id="confirmBtn">Confirm &amp; find eligible ${S.theme==='casino'?'dealers':'nurses'}</button><span style="font-size:12px;opacity:.6">Nothing is sent yet</span></div>`,{wait:1100});
  $$('.tog',m).forEach(b=>b.onclick=()=>{if(S.req.status!=='DRAFT')return;S.opts[b.dataset.k]=!S.opts[b.dataset.k];b.classList.toggle('on');renderRail()});
  S.flowBusy=false;
  $('#confirmBtn').onclick=async e=>{if(S.flowBusy)return;S.flowBusy=true;e.target.disabled=true;e.target.style.opacity=.5;await confirmStep()};
}
async function confirmStep(){
  const c=cfg();
  if(S.opts.inc){
    S.req.status='PENDING_APPROVAL';renderRail();
    const m=await aiSay(`Because there’s an incentive, I sent this to <b>${c.peer}</b> for approval. You can’t approve your own request.<div class="offers"><div class="offer sending"><span class="nm">Waiting on approval<div class="sub">${c.gap.incentive}</div></span><span class="pill gold">Pending</span></div></div>`);
    await sleep(2200);
    m.querySelector('.offer').classList.remove('sending');m.querySelector('.offer').innerHTML=`<span class="nm">Approved by ${c.peer.split(',')[0]}<div class="sub">${c.gap.incentive}</div></span><span class="pill green">Approved</span>`;
    await sleep(500);
  }
  S.req.status='READY_FOR_OUTREACH';renderRail();
  const pool=c.roster;
  const isElig=r=>r.tag==='base'||(r.tag==='ot'&&S.opts.ot)||(r.tag==='cross'&&S.opts.cross);
  const m=await aiSay(`Checking ${pool.length} ${S.theme==='casino'?'dealers':'nurses'} against certification, availability, rest rules and hours…<div class="elig">${pool.map(r=>`<div class="ecard" data-id="${r.id}"><div class="front"></div><div class="back ${isElig(r)?'':'no'}"><span class="tick ${isElig(r)?'y':'n'}">${isElig(r)?'✓':'✕'}</span><div class="nm">${r.n}</div><div class="rs">${isElig(r)?r.ok:(r.no||'Needs overtime or cross-training')}</div></div></div>`).join('')}</div>`,{wait:600});
  const cards=$$('.ecard',m);
  for(const cd of cards){await sleep(170);cd.classList.add('rev')}
  S.req.eligible=pool.filter(isElig).map(r=>r.id);
  await sleep(500);
  const m2=await aiSay(`<b>${S.req.eligible.length} eligible</b> out of ${pool.length}. Ready to send offers by email and text. I won’t send anything until you say so.
   <div class="actRow"><button class="actBtn primary" id="outBtn">Send ${S.req.eligible.length} offers</button><button class="actBtn" onclick="go(3)">Review ${cfg().views[3].l.toLowerCase()}</button></div>`);
  S.flowBusy=false;
  $('#outBtn').onclick=async e=>{if(S.flowBusy)return;S.flowBusy=true;e.target.disabled=true;e.target.style.opacity=.5;await outreachStep()};

async function outreachStep(){
  const c=cfg();S.req.status='OUTREACH_IN_PROGRESS';renderRail();
  const el=S.req.eligible.map(id=>c.roster.find(r=>r.id===id));
  const m=await aiSay(`Offers are out. Responses come back through each person’s secure link.<div class="offers">${el.map(r=>`<div class="offer sending" data-id="${r.id}"><span class="nm">${r.n}<div class="sub">${r.role} · fit ${r.fit}</div></span><span class="pill dim">Sent</span></div>`).join('')}</div>`,{wait:500});
  const order=[...el].sort((a,b)=>({accept:0,decline:1,pending:2}[a.resp]-({accept:0,decline:1,pending:2}[b.resp])));
  for(const r of order){
    await sleep(900);const row=m.querySelector(`.offer[data-id="${r.id}"]`);
    if(r.resp==='pending')continue;
    row.classList.remove('sending');S.req.offers[r.id]=r.resp;
    row.querySelector('.pill').className='pill '+(r.resp==='accept'?'green':'red');row.querySelector('.pill').textContent=r.resp==='accept'?'Accepted':'Declined';
    if(S.theme==='casino'&&r.resp==='accept')miniChip(row);

  const acc=el.filter(r=>S.req.offers[r.id]==='accept').sort((a,b)=>b.fit-a.fit);
  const rec=acc.slice(0,c.gap.need).map(r=>r.id);
  await sleep(400);
  const m2=await aiSay(`<b>${acc.length} accepted.</b> I’d assign <b>${rec.map(nameOf).join('</b> and <b>')}</b>: best fit and ${S.theme==='casino'?'no overtime':'well under the fatigue limit'}. Only ${c.gap.need} positions are open, so I won’t overfill.
    <div class="offers">${acc.map(r=>`<label class="offer"><input type="checkbox" value="${r.id}" ${rec.includes(r.id)?'checked':''}><span class="nm">${r.n}<div class="sub">${r.ok}</div></span><span class="pill gold">fit ${r.fit}</span></label>`).join('')}</div>
    <div class="warn" id="ofw" style="display:none">Only ${c.gap.need} positions are open. Unselect one to continue.</div>
    <div class="actRow"><button class="actBtn primary" id="asgBtn">Assign &amp; fill</button></div>`);
  S.flowBusy=false;
  const chk=()=>{const n=$$('input:checked',m2).length;$('#ofw').style.display=n>c.gap.need?'block':'none';$('#asgBtn').disabled=n>c.gap.need||n===0;$('#asgBtn').style.opacity=$('#asgBtn').disabled?.5:1};
  $$('input',m2).forEach(i=>i.onchange=chk);
  $('#asgBtn').onclick=async e=>{if(e.target.disabled||S.flowBusy)return;S.flowBusy=true;e.target.disabled=true;e.target.style.opacity=.5;
    S.req.assigned=$$('input:checked',m2).map(i=>i.value);await fillStep()};
}

function ringSvg(p,col,size,big,small){

function arcPath(cx,cy,r1,r2,a0,a1){
  const p=(r,a)=>[cx+r*Math.sin(a),cy-r*Math.cos(a)];
  const [x1,y1]=p(r2,a0),[x2,y2]=p(r2,a1),[x3,y3]=p(r1,a1),[x4,y4]=p(r1,a0);const lg=a1-a0>Math.PI?1:0;
  return `M${x1},${y1} A${r2},${r2} 0 ${lg} 1 ${x2},${y2} L${x3},${y3} A${r1},${r1} 0 ${lg} 0 ${x4},${y4} Z`;
}
function casinoWheel(){
  const c=cfg(),el=$('#v-schedule'),d=laneData(S.day),pct=dayPct(S.day);

   <circle cx="${cx}" cy="${cy}" r="246" fill="url(#wood)" stroke="#d4af37" stroke-width="3"/>`;
  for(let h=0;h<24;h++){
    const a0=h*step,a1=(h+1)*step;const red=h%2===0;
    svg+=`<path d="${arcPath(cx,cy,206,236,a0+.004,a1-.004)}" fill="${h===0?'#1f8a52':red?'#9b1d26':'#151515'}" stroke="#d4af37" stroke-width=".8"/>`;
    const am=(a0+a1)/2;const lbl=h===0?'12a':h===12?'12p':h<12?h:(h-12);
    svg+=`<text x="${cx+221*Math.sin(am)}" y="${cy-221*Math.cos(am)+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#f6efe0" font-family="Cinzel" transform="rotate(${am*180/Math.PI} ${cx+221*Math.sin(am)} ${cy-221*Math.cos(am)})">${lbl}</text>`;
  }
  const rings=[[178,200],[152,174],[126,148],[100,122]];
  d.forEach((L,li)=>{const [r1,r2]=rings[li];
    for(let h=0;h<24;h++){const a0=h*step+.01,a1=(h+1)*step-.01;const short=L.sch[h]<L.req[h];
      const op=.25+.75*(L.req[h]/L.max);
      svg+=`<path class="${short?'gapArc':''}" d="${arcPath(cx,cy,r1,r2,a0,a1)}" fill="${short?'#ff4d4d':L.c}" opacity="${short?1:op}"><title>${L.k} ${h}:00 · ${L.sch[h]}/${L.req[h]} dealers</title></path>`}});

   <text x="${cx}" y="${cy+22}" text-anchor="middle" font-size="40" fill="#fbe7a1" font-family="Cinzel" font-weight="900">${Math.round(pct)}%</text>
   <text x="${cx}" y="${cy+42}" text-anchor="middle" font-size="10.5" fill="#cdb879" letter-spacing="1">COVERED</text>`;

  // chip stacks: 12 x 2h
  const cols=Array.from({length:12},(_,b)=>{const h=b*2;
    let chips='',ghost='';let tot=0,req=0;

    <div class="dayChips">${DAYS.map((dn,i)=>{const p=dayPct(i);return `<button class="dchip ${i===S.day?'on':''}" data-d="${i}"><div class="chip" style="--c:${p>=99.5?'#1f8a52':p>=97?'#b88a1e':'#c62f3a'}"><b>${Math.round(p)}</b></div>${dn}</button>`}).join('')}</div></div>

function hospitalPulse(){
  const c=cfg(),el=$('#v-schedule'),d=laneData(S.day),pct=dayPct(S.day);
  const W=1040,H=230,base=150;
  const ratio=h=>{let a=0,b=0;d.forEach(L=>{a+=L.sch[h];b+=L.req[h]});return a/b};
  let pts=[];const per=W/24;
  for(let h=0;h<24;h++){
    const r=ratio(h),y=base-(r-0.85)*260;const x0=h*per;const short=r<0.999;
    const amp=short?10:42;
    pts.push([x0,y],[x0+per*.35,y],[x0+per*.42,y-amp*.25],[x0+per*.48,y+amp*.18],[x0+per*.54,y-amp],[x0+per*.6,y+amp*.35],[x0+per*.66,y],[x0+per,y]);
  }
  const path='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
  const gaps=[];for(let h=0;h<24;h++)if(ratio(h)<0.999)gaps.push(h);
  const gapRects=gaps.map(h=>`<rect x="${h*per}" y="0" width="${per}" height="${H}" fill="rgba(229,72,77,.14)"/>`).join('');
  const blocks=Array.from({length:12},(_,b)=>b*2);
  el.innerHTML=`<div class="ph"><div><h2>Coverage</h2><p>Staffing pulse across every unit. Flatlines are short staffed.</p></div>
    <div class="rings">${DAYS.map((dn,i)=>{const p=dayPct(i);return `<button class="ringBtn ${i===S.day?'on':''}" data-d="${i}">${ringSvg(p/100,p>=99.5?'#0ea5a4':p>=97?'#f59e0b':'#e5484d',46,'')}${dn}</button>`}).join('')}</div></div>
    <div class="monitor"><div class="grid"></div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">${gapRects}
        <line x1="0" x2="${W}" y1="${base-(1-0.85)*260}" y2="${base-(1-0.85)*260}" stroke="#5eead4" stroke-dasharray="4 6" opacity=".35"/>
        <path d="${path}" fill="none" stroke="#5eead4" stroke-width="2.2" style="filter:drop-shadow(0 0 4px #2dd4bf)"/>
        ${gaps.length?`<path d="${path}" fill="none" stroke="#ff6b6b" stroke-width="2.4" clip-path="url(#gc)"/><clipPath id="gc">${gaps.map(h=>`<rect x="${h*per}" y="0" width="${per}" height="${H}"/>`).join('')}</clipPath>`:''}
        ${[0,6,12,18].map(h=>`<text x="${h*per+6}" y="${H-8}" font-size="10" fill="#5eead4" opacity=".6" font-family="JetBrains Mono">${String(h).padStart(2,'0')}:00</text>`).join('')}
      </svg><div class="sweep"></div>
      <div class="tl">STAFFING PULSE · ${DAYS[S.day].toUpperCase()}${S.day===TODAY?' · TODAY':''}</div>
      <div class="readout"><b style="color:${pct>=99.5?'#5eead4':'#ff8d8d'}">${pct}%</b><small>OF REQUIRED RN HOURS</small></div></div>
    <div class="heat"><table><tr><th></th>${blocks.map(h=>`<th>${String(h).padStart(2,'0')}</th>`).join('')}</tr>
      ${d.map(L=>`<tr><td class="lab">${L.k}</td>${blocks.map(h=>{const [s,r]=blk(L,h);const short=s<r;
        return `<td style="background:${short?'#e5484d':L.c};opacity:${short?1:.35+.65*(r/L.max)}" title="${L.k} ${h}:00 · ${s}/${r} RNs">${s}/${r}</td>`}).join('')}</tr>`).join('')}
    </table></div>`;
  $$('.ringBtn',el).forEach(b=>b.onclick=()=>{S.day=+b.dataset.d;hospitalPulse()});
}

  el.innerHTML=`<div class="ph"><div><h2>The Count</h2><p>This week’s coverage, paid out. Pull the lever to spin again.</p></div><span class="pill gold">Week of Nov 16</span></div>
   <div class="slot"><div class="lights">${'<i></i>'.repeat(22)}</div>
     <div class="reels">${[['fill',k.fill,'%'],['ttf',k.ttf,'m'],['ot',k.ot,'h']].map(([id,v,u])=>`<div class="reel"><div class="strip" id="reel-${id}" data-v="${v}" data-u="${u}"></div></div>`).join('')}</div>
     <div class="reelLbl"><div>Fill rate</div><div>Avg time to fill</div><div>OT hours saved</div></div>
     <div class="lever" id="lever"></div></div>
   <div class="weekChips">${DAYS.map((dn,i)=>{const p=dayPct(i);const n=Math.round((p-90)/10*12);return `<div class="scol" style="width:60px">${Array.from({length:Math.max(2,n)},(_,q)=>`<div class="cchip" style="--c:${p>=99.5?'#1f8a52':p>=97?'#b88a1e':'#c62f3a'};animation-delay:${i*60+q*30}ms"></div>`).join('')}<div class="tot">${Math.round(p)}%</div><label style="bottom:-20px">${dn}</label></div>`}).join('')}</div>
   <div class="board"><div style="font-family:Cinzel;font-weight:700;color:#f3d77a;font-size:16px">Hot streak</div><div style="font-size:12px;opacity:.65;margin:4px 0 12px">Most shifts picked up through Ace this month</div>
     ${leaders.map((l,i)=>`<div class="lead"><span class="rank">${i+1}</span><div class="chip" style="--c:${['#d4af37','#c62f3a','#2b59c3','#1f8a52','#7a3fc4'][i]};width:30px;height:30px"></div><span style="width:120px">${l[0]}</span><div class="bar"><u style="width:${l[1]/9*100}%"></u></div><b style="width:24px;text-align:right">${l[1]}</b></div>`).join('')}
     <div style="margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
       <div class="rcard" style="padding:14px"><h4>Offers sent</h4><div style="font-family:Cinzel;font-size:28px;font-weight:900;color:#fbe7a1">${S.filled?58:53}</div></div>
       <div class="rcard" style="padding:14px"><h4>Accept rate</h4><div style="font-family:Cinzel;font-size:28px;font-weight:900;color:#fbe7a1">${S.filled?64:61}%</div></div></div></div>`;
  ['fill','ttf','ot'].forEach(id=>{const s=$('#reel-'+id,el);const v=+s.dataset.v,u=s.dataset.u;let h='';for(let q=0;q<14;q++){let x=Math.max(1,Math.round(v*(.4+Math.random()*.9)));if(u==='%')x=Math.min(99,x);h+=`<div>${x}${u}</div>`};h+=`<div>${v}${u}</div>`;s.innerHTML=h});
  $('#lever',el).onclick=e=>{e.target.classList.add('pull');setTimeout(()=>e.target.classList.remove('pull'),300);spinReels()};
}
function spinReels(){
  if(S.theme!=='casino')return;
  $$('.reel .strip').forEach((s,i)=>{const n=s.children.length;s.style.transition='none';s.style.transform='translateY(0)';s.offsetHeight;
    s.style.transition=`transform ${1.8+i*.45}s cubic-bezier(.15,.8,.25,1.04)`;s.style.transform=`translateY(${-(n-1)*150}px)`});
}
function hospitalInsights(){
  const el=$('#v-insights'),k=kpiVals();
  const tr=[93.1,95.4,94.2,96.8,97.5,96.2,dayPct(TODAY)];
  const W=480,H=200,mn=90,mx=100;const pts=tr.map((v,i)=>[20+i*(W-40)/6,H-20-(v-mn)/(mx-mn)*(H-50)]);
  const fun=[['Eligible',S.filled?42:37],['Offered',S.filled?41:36],['Accepted',S.filled?27:23],['Assigned',S.filled?24:21]];
  el.innerHTML=`<div class="ph"><div><h2>Insights</h2><p>How coverage is trending and where offers convert.</p></div><span class="pill dim">Last 7 days</span></div>
   <div class="kpis">
     <div class="kpi">${ringSvg(k.fill/100,'#0ea5a4',90,k.fill+'%')}<div><b>${k.fill}%</b><small>Open shifts filled<br>before shift start</small></div></div>
     <div class="kpi">${ringSvg(1-k.ttf/30,'#2563eb',90,k.ttf+'m')}<div><b>${k.ttf} min</b><small>Median time from<br>call-out to filled</small></div></div>
     <div class="kpi">${ringSvg(k.ot/20,'#7c3aed',90,k.ot*12+'h')}<div><b>${k.ot*12} hrs</b><small>Agency hours avoided<br>this month</small></div></div></div>
   <div class="funnel"><div style="font-weight:800;font-size:15px">Offer funnel</div><div style="font-size:12px;color:#4b6175">From eligible staff to assigned shifts</div>
     ${fun.map(f=>`<div class="frow"><span>${f[0]}</span><i style="width:${f[1]/42*330}px">${f[1]}</i></div>`).join('')}
     <div style="font-size:12px;color:#4b6175;margin-top:16px">Nobody is ever assigned past headcount. Extra acceptances are thanked and released.</div></div>
   <div class="trend"><div style="font-weight:800;font-size:15px">Required RN hours covered</div><div style="font-size:12px;color:#4b6175">Daily, all units</div>
     <svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:10px"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5a4" stop-opacity=".35"/><stop offset="1" stop-color="#0ea5a4" stop-opacity="0"/></linearGradient></defs>
       <path d="M${pts.map(p=>p.join(',')).join(' L')} L${pts[6][0]},${H-20} L${pts[0][0]},${H-20} Z" fill="url(#tg)"/>
       <path d="M${pts.map(p=>p.join(',')).join(' L')}" fill="none" stroke="#0ea5a4" stroke-width="3" stroke-linejoin="round"/>
       ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===6?6:4}" fill="#fff" stroke="${i===6?'#2563eb':'#0ea5a4'}" stroke-width="2.5"/><text x="${p[0]}" y="${p[1]-12}" text-anchor="middle" font-size="11" font-weight="700" fill="#0f2233">${Math.round(tr[i])}%</text><text x="${p[0]}" y="${H-4}" text-anchor="middle" font-size="10.5" fill="#7a8da0">${i===6?'Today':['Wed','Thu','Fri','Sat','Sun','Mon'][i]}</text>`).join('')}
     </svg></div>`;
}

/* boot */
fit();
const h=(location.hash||'').replace('#','');const EMBED=h==='embed';if(h==='healthcare'||h==='casino')S.theme=h;
resetReq();
const PW_HASH='38599b5a729b7c73a6a9aff253cb63749f52a37718bd17de8d2973b23dd78a82';
async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return null}}
function unlocked(){try{return sessionStorage.getItem('sca-ok')==='1'}catch(e){return false}}
function gate(){
  document.body.className=S.theme;
  if(unlocked()||EMBED){mount();return}
  const g=document.createElement('div');g.id='gate';
  g.innerHTML=`<form autocomplete="off"><div class="gm">${S.theme==='casino'?'SC':'+'}</div><h1>Shift Coverage Agent</h1><p>Concept demo by Plan A Technologies. Enter the password to continue.</p><input type="password" id="gpw" placeholder="Password" autofocus><button type="submit">Enter demo</button><div class="err" id="gerr"></div></form>`;
  document.body.appendChild(g);
  g.querySelector('form').onsubmit=async e=>{e.preventDefault();const v=$('#gpw').value;const hv=await sha(v);
    const ok=hv?hv===PW_HASH:v===['P','l','a','n','A'].join('');
    if(ok){try{sessionStorage.setItem('sca-ok','1')}catch(e){};g.remove();mount()}
    else{$('#gerr').textContent='That password isn\u2019t right.';g.classList.remove('shake');g.offsetHeight;g.classList.add('shake');$('#gpw').select()}};
  setTimeout(()=>$('#gpw')&&$('#gpw').focus(),50);
}
gate();
addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if((h==='healthcare'||h==='casino')&&h!==S.theme)switchTheme(h)});
</script>
