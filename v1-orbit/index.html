<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift Coverage · V1 Draft B · Orbit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#04060b}
body{font-family:Inter,system-ui,sans-serif;color:#e8ecf5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1))}
.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 70% 20%,rgba(255,255,255,.4),transparent),radial-gradient(1.5px 1.5px at 40% 80%,rgba(255,255,255,.35),transparent),radial-gradient(1px 1px at 85% 60%,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 10% 70%,rgba(255,255,255,.3),transparent);background-size:400px 300px;opacity:.6}
.neb{position:absolute;left:200px;top:150px;width:1000px;height:640px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(124,92,255,.22),rgba(34,211,238,.06) 50%,transparent 70%);filter:blur(30px)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 20px 50px rgba(0,0,0,.4)}
.top{position:absolute;left:40px;right:40px;top:22px;height:52px;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:12px}
.logo .m{width:38px;height:38px;border-radius:50%;background:conic-gradient(#f3d77a,#7c5cff,#22d3ee,#f3d77a);display:grid;place-items:center}
.logo .m i{width:28px;height:28px;border-radius:50%;background:#0b0f1a;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800}
.logo b{font-family:Manrope;font-size:16px}.logo small{display:block;font-size:11.5px;opacity:.55}
.sp{flex:1}
.event{font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.35);color:#ffb3c1}
.user{display:flex;align-items:center;gap:10px;font-size:13px}
.user .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#22d3ee);display:grid;place-items:center;font-weight:800;font-size:12px}
.user small{display:block;opacity:.55;font-size:11px}
.stats{position:absolute;left:40px;top:96px;display:flex;gap:10px;width:1060px}
.stats .stat{flex:1}
.stat{border-radius:16px;padding:12px 16px}
.stat small{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;opacity:.55}
.stat b{display:block;font-family:Manrope;font-weight:800;font-size:28px;margin-top:2px}
#orbitSvg{position:absolute;left:0;top:0;pointer-events:none}
.core{position:absolute;left:630px;top:470px;width:140px;height:140px;margin:-70px;border-radius:50%;z-index:50;display:grid;place-items:center;cursor:pointer}
.core .ball{position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9e3ff,#8b6cff 40%,#3b1d9a 75%,#1a0b4a);box-shadow:0 0 60px rgba(124,92,255,.8),0 0 120px rgba(124,92,255,.35);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 80px rgba(124,92,255,1),0 0 160px rgba(124,92,255,.5)}}
.core .ring{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(243,215,122,.85) 0 8deg,transparent 8deg 22.5deg);-webkit-mask:radial-gradient(circle,transparent 63px,#000 64px,#000 69px,transparent 70px);mask:radial-gradient(circle,transparent 63px,#000 64px,#000 69px,transparent 70px);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.core span{position:relative;font-family:Manrope;font-weight:800;font-size:13px;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.core.pulse .ball{animation:hit .8s ease}
@keyframes hit{30%{transform:scale(1.15);filter:brightness(1.6)}}
.planet{position:absolute;border-radius:50%;cursor:pointer;display:grid;place-items:center;text-align:center;transform:translate(-50%,-50%);transition:box-shadow .3s}
.planet .body{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),var(--c) 45%,color-mix(in srgb,var(--c) 30%,#05070c) 100%);opacity:.9;box-shadow:inset -8px -10px 20px rgba(0,0,0,.45),0 0 30px color-mix(in srgb,var(--c) 45%,transparent)}
.planet svg{position:absolute;inset:-9px;width:calc(100% + 18px);height:calc(100% + 18px)}
.planet .nm{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;text-shadow:0 2px 8px #000}
.planet .nm small{display:block;font-weight:500;opacity:.6;font-size:10.5px}
.planet .bd{position:absolute;right:-4px;top:-4px;min-width:22px;height:22px;border-radius:11px;background:#ff4d6d;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 3px #04060b,0 0 14px #ff4d6d}
.planet.sel{box-shadow:0 0 0 3px #fff,0 0 40px rgba(255,255,255,.4)}
.panel{position:absolute;right:40px;top:100px;width:420px;bottom:120px;border-radius:24px;padding:22px;overflow:hidden}
.panel h3{font-family:Manrope;font-size:22px}
.panel .k{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.55}
.issue{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;margin-top:8px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);transition:background .2s}
.issue:hover{background:rgba(255,255,255,.08)}
.issue i{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.issue{padding:8px 12px!important;margin-top:6px!important}.issue>div{min-width:0;flex:1}.issue b{font-size:13px;display:block}.issue small{font-size:11.5px;opacity:.6;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.issue em{margin-left:auto;font-style:normal;font-family:'JetBrains Mono';font-size:12px;font-weight:700;color:#ffb3c1}
.prop{margin-top:16px;border-radius:18px;padding:16px;position:relative;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14)}
.prop .suit{position:absolute;right:14px;top:10px;font-size:16px;opacity:.5}
.prop h4{font-family:Manrope;font-size:16px;line-height:1.3;padding-right:20px}
.prop p{font-size:12.5px;opacity:.65;margin-top:6px;line-height:1.45}
.btns{display:flex;gap:8px;margin-top:14px}
.btns button{font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:10px}
.btns .ok{background:#fff;color:#0b0f1a}.btns .gh{background:rgba(255,255,255,.08)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.roles div{border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.25);font-size:11.5px}
.roles b{display:block;font-family:Manrope;font-size:17px}
.cmd{position:absolute;left:330px;width:620px;bottom:40px;height:54px;border-radius:999px;display:flex;align-items:center;gap:12px;padding:0 10px 0 22px;z-index:60}
.cmd input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:14.5px}
.cmd input::placeholder{color:rgba(232,236,245,.45)}
.cmd button{font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:999px;background:linear-gradient(135deg,#7c5cff,#22d3ee);color:#fff}
.fly{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;z-index:70;pointer-events:none;background:repeating-conic-gradient(var(--c) 0 30deg,#fff 30deg 40deg,var(--c) 40deg 60deg);box-shadow:0 0 14px var(--c)}
.toast{position:absolute;left:50%;top:84px;transform:translate(-50%,-10px);opacity:0;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;transition:all .4s;pointer-events:none;z-index:90}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fade{animation:fd .4s ease both}@keyframes fd{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.draft{position:absolute;left:40px;bottom:12px;font-size:11px;opacity:.4}
</style>
</head>
<body>
<div id="app">
  <div class="stars"></div><div class="neb"></div>
  <div class="top"><div class="logo"><div class="m"><i>SC</i></div><div><b>Shift Coverage</b><small>Example Resort &amp; Casino</small></div></div><div class="sp"></div>
    <span class="event">Sat Nov 21 · Fight Night</span><div class="user"><div class="av">MR</div><div><b>Maya Rivers</b><small>VP, Resort Operations</small></div></div></div>
  <div class="stats" id="stats"></div>
  <svg id="orbitSvg" width="1600" height="900"></svg>
  <div id="world"></div>
  <div class="core" id="core"><div class="ring"></div><div class="ball"></div><span>AGENT</span></div>
  <div class="panel glass" id="panel"></div>
  <form class="cmd glass" id="cmd"><input id="q" placeholder="Ask the agent to cover Saturday, move staff, or check overtime"><button type="submit">Ask</button></form>
  <div class="toast glass" id="toast"></div>
  <div class="draft">V1 · Draft B · Orbit · concept</div>
</div>
<script src="../gate.js"></script>
<script>
const DEPTS=[
 {k:'casino',n:'Casino Floor',s:'Table games',hc:142,c:'#f3d77a',open:2,roles:[['Dealers',96],['Supervisors',22],['Pit managers',8],['Cage',16]]},
 {k:'slots',n:'Slot Ops',s:'Techs & attendants',hc:38,c:'#fbbf24',open:0,roles:[['Slot techs',14],['Attendants',24]]},
 {k:'front',n:'Front Desk',s:'Hotel',hc:46,c:'#a78bfa',open:3,roles:[['Desk agents',28],['Concierge',10],['PBX',8]]},
 {k:'hk',n:'Housekeeping',s:'Hotel',hc:210,c:'#c4b5fd',open:0,roles:[['Room attendants',168],['Inspectors',22],['Porters',20]]},
 {k:'valet',n:'Bell & Valet',s:'Arrivals',hc:54,c:'#22d3ee',open:6,roles:[['Valet',32],['Bell',18],['Dispatch',4]]},
 {k:'sec',n:'Security',s:'Arena & property',hc:120,c:'#60a5fa',open:8,roles:[['Officers',96],['Supervisors',16],['Dispatch',8]]},
 {k:'steak',n:'Ember & Oak',s:'Steakhouse',hc:34,c:'#fb923c',open:2,roles:[['Servers',14],['Bartenders',6],['Hosts',4],['Kitchen',10]]},
 {k:'market',n:'The Market',s:'Buffet',hc:60,c:'#f97316',open:0,roles:[['Attendants',38],['Cooks',22]]},
 {k:'shop',n:'Resort Shop',s:'Retail',hc:18,c:'#f472b6',open:1,roles:[['Associates',14],['Leads',4]]},
 {k:'it',n:'IT',s:'Systems',hc:22,c:'#34d399',open:0,roles:[['On-call',6],['Help desk',16]]},
 {k:'evs',n:'Facilities & EVS',s:'Cleaning',hc:85,c:'#2dd4bf',open:4,roles:[['EVS crew',60],['Engineers',25]]},
 {k:'grounds',n:'Grounds & Pool',s:'Outdoor',hc:30,c:'#4ade80',open:0,roles:[['Grounds',18],['Pool',12]]},
 {k:'mkt',n:'Marketing',s:'VIP & events',hc:16,c:'#e879f9',open:2,roles:[['VIP hosts',10],['Promotions',6]]}
];
const PROPS={sec:['Cover arena entry with 5 internal officers and 3 contract officers','Internal officers stay under 12 hrs with 10 hrs rest. Contract officers come from the approved vendor with valid guard cards.'],
 valet:['Move 4 cross-trained bell staff to valet, offer 2 on-call shifts','Bell desk stays at minimum. All 4 hold valet driving clearance.'],
 casino:['Riley Chen and Morgan Reyes to High Limit Baccarat','Both certified, free tonight, no overtime. Gaming licenses current.'],
 steak:['Jane Doe from Front Desk and Sam Patel to Ember & Oak','Jane is cross-trained in F&B with a current food handler card. Union seniority respected.'],
 front:['Shift 2 concierge agents to the desk from 2 to 6 PM','Covers the arrival wave. Concierge keeps one agent on the floor.'],
 evs:['Offer arena teardown to 4 overnight EVS crew','Starts at midnight. Overnight crew is under weekly hours.'],
 mkt:['2 Players Club reps to VIP check-in','Same CRM access. Back on Players Club by 7 PM.'],
 shop:['Extend one shop associate by 2 hours','Stays within 10 hrs for the day.']};
const SUITS=['♠','♥','♦','♣'];
const CX=630,CY=470,RX=460,RY=185;
let offset=0,target=null,sel=null;const resolved=new Set();
const N=DEPTS.length;
const size=d=>40+Math.sqrt(d.hc)*4.6;
function ringArc(p,col){const r=50,C=2*Math.PI*r;return `<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 60 60)" style="transition:stroke-dashoffset 1s"/></svg>`}
function covOf(d){if(resolved.has(d.k)||!d.open)return 1;return Math.max(.6,1-d.open*6/(d.hc*1.2))}
function build(){
  const W=document.getElementById('world');
  W.innerHTML=DEPTS.map(d=>{const s=size(d),cv=covOf(d),col=cv>=.999?'#5eead4':cv>=.95?'#fcd34d':'#ff6b81';const open=resolved.has(d.k)?0:d.open;
    return `<div class="planet ${sel===d.k?'sel':''}" data-k="${d.k}" style="--c:${d.c};width:${s}px;height:${s}px">${ringArc(cv,col)}<div class="body"></div>${open?`<span class="bd">${open}</span>`:''}<div class="nm">${d.n}<small>${d.hc} staff</small></div></div>`}).join('');
  document.querySelectorAll('.planet').forEach(p=>p.onclick=()=>select(p.dataset.k));
  place();
}
function place(){
  document.querySelectorAll('.planet').forEach((p,i)=>{
    const a=offset+i*2*Math.PI/N, x=CX+RX*Math.cos(a), y=CY+RY*Math.sin(a), depth=(Math.sin(a)+1)/2;
    const sc=.6+.55*depth;
    p.style.left=x+'px';p.style.top=y+'px';p.style.transform=`translate(-50%,-50%) scale(${sc})`;
    p.style.zIndex=Math.round(depth*100)<50?Math.round(depth*40):Math.round(51+depth*40);
    p.style.opacity=.45+.55*depth;p.style.filter=`blur(${(1-depth)*1.4}px)`;
  });
}
function svgOrbit(){document.getElementById('orbitSvg').innerHTML=`<defs><linearGradient id="og" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,.05)"/><stop offset="1" stop-color="rgba(255,255,255,.28)"/></linearGradient></defs>
  <ellipse cx="${CX}" cy="${CY}" rx="${RX}" ry="${RY}" fill="none" stroke="url(#og)" stroke-width="1.5"/><ellipse cx="${CX}" cy="${CY}" rx="${RX*.62}" ry="${RY*.62}" fill="none" stroke="rgba(255,255,255,.06)" stroke-dasharray="2 8"/><ellipse cx="${CX}" cy="${CY}" rx="${RX*1.22}" ry="${RY*1.22}" fill="none" stroke="rgba(255,255,255,.05)" stroke-dasharray="2 10"/>`}
let last=performance.now();
function tick(t){const dt=(t-last)/1000;last=t;
  if(target!==null){let d=target-offset;d=Math.atan2(Math.sin(d),Math.cos(d));if(Math.abs(d)<.002){offset=target;target=null}else offset+=d*Math.min(1,dt*4)}
  else if(!sel)offset+=dt*.06;
  place();requestAnimationFrame(tick)}
function select(k){sel=k;const i=DEPTS.findIndex(d=>d.k===k);target=Math.PI/2-i*2*Math.PI/N;
  document.querySelectorAll('.planet').forEach(p=>p.classList.toggle('sel',p.dataset.k===k));detail()}
function summary(){
  const P=document.getElementById('panel');const iss=DEPTS.filter(d=>d.open&&!resolved.has(d.k)).sort((a,b)=>b.open-a.open);
  P.innerHTML=`<div class="fade"><div class="k">Saturday · Fight Night</div><h3>${iss.length?iss.length+' departments need you':'Everything is covered'}</h3>
   <p style="font-size:13px;opacity:.65;margin-top:6px;line-height:1.5">${iss.length?'The agent has a plan for each one. Pick a department or approve them all.':'Every department is at 100%. Offers are going out.'}</p>
   ${iss.map(d=>`<div class="issue" data-k="${d.k}"><i style="background:${d.c};box-shadow:0 0 10px ${d.c}"></i><div><b>${d.n}</b><small>${PROPS[d.k][0]}</small></div><em>−${d.open}</em></div>`).join('')}
   ${iss.length?'<div class="btns"><button class="ok" id="allOk">Approve all proposals</button></div>':''}</div>`;
  P.querySelectorAll('.issue').forEach(x=>x.onclick=()=>select(x.dataset.k));
  const a=document.getElementById('allOk');if(a)a.onclick=async()=>{for(const d of iss){approve(d.k,true);await new Promise(r=>setTimeout(r,280))}summary()};
}
function detail(){
  const d=DEPTS.find(x=>x.k===sel),P=document.getElementById('panel'),i=DEPTS.indexOf(d),cv=covOf(d),pr=PROPS[d.k],done=resolved.has(d.k)||!d.open;
  P.innerHTML=`<div class="fade"><button class="k" id="back" style="opacity:.7">← All departments</button>
   <div style="display:flex;align-items:center;gap:16px;margin-top:14px"><div style="width:84px;height:84px;position:relative">${ringArc(cv,cv>=.999?'#5eead4':'#ff6b81')}<div style="position:absolute;inset:0;display:grid;place-items:center;font-family:Manrope;font-weight:800;font-size:18px">${Math.round(cv*1000)/10}%</div></div>
   <div><div class="k" style="color:${d.c};opacity:1">${d.s}</div><h3>${d.n}</h3><div style="font-size:12.5px;opacity:.6">${d.hc} staff · ${done?'fully covered':d.open+' open shifts Saturday'}</div></div></div>
   <div class="roles">${d.roles.map(r=>`<div><span style="opacity:.6">${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>
   ${pr&&!done?`<div class="prop"><span class="suit" style="${i%4===1||i%4===2?'color:#ff6b81':''}">${SUITS[i%4]}</span><div class="k">Proposed by the agent</div><h4 style="margin-top:6px">${pr[0]}</h4><p>${pr[1]}</p><div class="btns"><button class="ok" id="ok">Approve</button><button class="gh">Adjust</button></div></div>`
     :`<div class="prop"><div class="k">Status</div><h4 style="margin-top:6px">${resolved.has(d.k)?'Approved. Offers sent and tracking.':'No gaps on Saturday.'}</h4></div>`}</div>`;
  document.getElementById('back').onclick=()=>{sel=null;document.querySelectorAll('.planet').forEach(p=>p.classList.remove('sel'));summary()};
  const ok=document.getElementById('ok');if(ok)ok.onclick=()=>{approve(d.k);setTimeout(detail,900)};
}
function approve(k,quiet){if(resolved.has(k))return;resolved.add(k);const d=DEPTS.find(x=>x.k===k);
  const core=document.getElementById('core');core.classList.remove('pulse');void core.offsetWidth;core.classList.add('pulse');
  const pl=document.querySelector(`.planet[data-k="${k}"]`);const tx=parseFloat(pl.style.left),ty=parseFloat(pl.style.top);
  for(let j=0;j<Math.min(d.open,6);j++){const f=document.createElement('div');f.className='fly';f.style.setProperty('--c',d.c);f.style.left=CX+'px';f.style.top=CY+'px';document.getElementById('app').appendChild(f);
    f.animate([{transform:'translate(0,0) scale(.4)'},{transform:`translate(${(tx-CX)/2}px,${(ty-CY)/2-80}px) scale(1.2)`},{transform:`translate(${tx-CX}px,${ty-CY}px) scale(.6)`,opacity:.2}],{duration:900,delay:j*80,easing:'cubic-bezier(.3,.7,.4,1)'}).onfinish=()=>f.remove()}
  setTimeout(()=>{build();stats()},850);if(!quiet)toast(`${d.n} approved · offers queued`)}
function stats(){const open=DEPTS.reduce((a,d)=>a+(resolved.has(d.k)?0:d.open),0);const p=DEPTS.filter(d=>d.open&&!resolved.has(d.k)).length;
  document.getElementById('stats').innerHTML=[['Saturday coverage',(open?(100-open*0.27).toFixed(1):'100')+'%'],['Open shifts',open],['Proposals ready',p],['Staff scheduled',(911-open)]].map(s=>`<div class="stat glass"><small>${s[0]}</small><b>${s[1]}</b></div>`).join('')}
document.getElementById('core').onclick=()=>{sel=null;document.querySelectorAll('.planet').forEach(p=>p.classList.remove('sel'));summary()};
document.getElementById('cmd').onsubmit=e=>{e.preventDefault();const v=document.getElementById('q').value.toLowerCase();document.getElementById('q').value='';
  const d=DEPTS.find(x=>v.includes(x.n.toLowerCase().split(' ')[0]));if(d){select(d.k);return}
  if(/cover|saturday|all/.test(v)){sel=null;summary();setTimeout(()=>document.getElementById('allOk')&&document.getElementById('allOk').click(),300);return}
  toast('Draft: try “cover Saturday” or a department name')};
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200)}
function fit(){document.getElementById('app').style.setProperty('--s',Math.min(innerWidth/1600,innerHeight/900))}
addEventListener('resize',fit);fit();
scaGate('dark',()=>{svgOrbit();build();stats();summary();requestAnimationFrame(tick)});
</script>
</body>
</html>
